<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <div id="result" role="status" aria-live="polite">
    <p id="notice"></p>
    <p id="topic"></p>
    <p id="draft"></p>
  </div>
  <script type="module">
    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const notice = document.querySelector("#notice");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topicNames = { delivery: "Доставка", pricing: "Стоимость", other: "Другое" };

    function clearResult() {
      notice.textContent = "";
      topic.textContent = "";
      draft.textContent = "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearResult();
      const text = document.querySelector("#message").value;
      if (!text.trim()) {
        notice.textContent = "Введите текст заявки.";
        return;
      }

      button.disabled = true;
      notice.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const result = await reply.json();
        if (!reply.ok || result.status !== "ready") {
          throw new Error("Manual review required");
        }
        notice.textContent = "Проверьте черновик перед отправкой клиенту.";
        topic.textContent = `Тема: ${topicNames[result.topic]}`;
        draft.textContent = `Черновик: ${result.draft}`;
      } catch {
        clearResult();
        notice.textContent = "Автоматический разбор не удался. Разберите заявку вручную и подготовьте ответ клиенту.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
